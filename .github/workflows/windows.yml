name: Windows
on:
  push:
    branches: [main, feature/windows-app]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_release_assets:
        description: Upload Windows packages to the existing draft release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: microsoft/setup-msbuild@v2
      - name: Read Windows version
        shell: pwsh
        run: |
          $version = (Get-Content windows/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid Windows version" }
          [xml]$project = Get-Content windows/Minutes.App/Minutes.App.csproj
          if ($project.Project.PropertyGroup.Version -ne $version) { throw "App version does not match windows/VERSION" }
          [xml]$manifest = Get-Content windows/Minutes.App/app.manifest
          if ($manifest.assembly.assemblyIdentity.version -ne "$version.0") { throw "Manifest version mismatch" }
          "MINUTES_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore core tests
        working-directory: windows
        run: dotnet restore Minutes.Core.Tests/Minutes.Core.Tests.csproj
      - name: Test portable logic
        working-directory: windows
        run: dotnet test Minutes.Core.Tests/Minutes.Core.Tests.csproj --no-restore -c Release --logger "trx;LogFileName=core.trx" --results-directory artifacts/tests
      - name: Restore Windows app
        working-directory: windows
        run: msbuild Minutes.App/Minutes.App.csproj -t:Restore -p:Platform=x64 -p:Configuration=Release
      - name: Build Windows app
        working-directory: windows
        run: msbuild Minutes.App/Minutes.App.csproj -t:Build -p:Configuration=Release -p:Platform=x64
      - name: Publish unsigned portable app
        working-directory: windows
        run: msbuild Minutes.App/Minutes.App.csproj -t:Publish -p:Configuration=Release -p:Platform=x64 -p:PublishDir="${{ github.workspace }}/windows/artifacts/Minutes/"
      - name: Restore speech engine cache
        uses: actions/cache@v4
        with:
          path: windows/.tool-cache
          key: windows-x64-speech-${{ hashFiles('windows/scripts/Bundle-Tools.ps1') }}
      - name: Bundle local speech engines
        shell: pwsh
        run: ./windows/scripts/Bundle-Tools.ps1 -Destination windows/artifacts/Minutes
      - name: Stamp build identity
        shell: pwsh
        run: |
          @{version="$env:MINUTES_VERSION"; build="$env:GITHUB_RUN_NUMBER"; commit="$env:GITHUB_SHA"; builtUtc=[DateTime]::UtcNow.ToString('o')} | ConvertTo-Json | Set-Content windows/artifacts/Minutes/build.json -Encoding utf8
      - name: Include validation guide
        shell: pwsh
        run: |
          Copy-Item windows/docs/TESTING.md windows/artifacts/Minutes/TESTING.md
          Copy-Item LICENSE windows/artifacts/Minutes/licenses/Minutes-LICENSE
          Copy-Item windows/licenses/Velopack-LICENSE windows/artifacts/Minutes/licenses/Velopack-LICENSE
      - name: Archive
        shell: pwsh
        run: Compress-Archive windows/artifacts/Minutes/* windows/artifacts/Minutes-${{ env.MINUTES_VERSION }}-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Minutes-${{ env.MINUTES_VERSION }}-win-x64-unsigned
          path: windows/artifacts/Minutes-${{ env.MINUTES_VERSION }}-win-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-test-results
          path: windows/artifacts/tests
      - name: Package Windows installer and update feed
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP/vpk" vpk --version 1.2.161
          & "$env:RUNNER_TEMP/vpk/vpk.exe" pack --packId MinutesDesktop --packVersion "$env:MINUTES_VERSION" --packDir windows/artifacts/Minutes --mainExe Minutes.App.exe --packTitle Minutes --outputDir windows/artifacts/updates
          if ($LASTEXITCODE -ne 0) { throw "Velopack packaging failed" }
          Move-Item windows/artifacts/updates/MinutesDesktop-win-Setup.exe windows/artifacts/updates/Minutes-win-Setup.exe
          Move-Item windows/artifacts/updates/MinutesDesktop-win-Portable.zip windows/artifacts/updates/Minutes-win-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Minutes-${{ env.MINUTES_VERSION }}-windows-installer-updates
          path: windows/artifacts/updates/*
          if-no-files-found: error
      - name: Verify updater upgrade and relaunch
        shell: pwsh
        run: ./windows/scripts/Test-Updater.ps1 -Vpk "$env:RUNNER_TEMP/vpk/vpk.exe"
  upload-release-assets:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_release_assets && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        run: echo "MINUTES_VERSION=$(cat windows/VERSION)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: Minutes-${{ env.MINUTES_VERSION }}-windows-installer-updates
          path: release-assets
      - name: Upload only to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "v$MINUTES_VERSION" --json isDraft --jq .isDraft)" = true
          gh release upload "v$MINUTES_VERSION" release-assets/* --clobber
